# ==========================
# Application Name
# ==========================
spring.application.name=servicepage
app.name=Eliteinova Matrimony

# ==========================
# Server Configuration
# ==========================
server.port=8080

# ==========================
# Database Configuration (PostgreSQL)
# ==========================
spring.datasource.url=jdbc:postgresql://localhost:5432/servicepage
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update        # use 'update' for dev, 'validate' or 'none' for prod
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ==========================
# Flyway (disabled if using JPA auto-ddl)
# ==========================
spring.flyway.enabled=false

# ==========================
# File Upload Configuration
# ==========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

# ==========================
# Email Configuration (Gmail SMTP)
# ==========================
# Instructions:
# 1. Enable 2-Step Verification in your Gmail account
# 2. Generate an App Password for your application
# 3. Replace username/password below
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.email.enabled=true

# ==========================
# Error Handling
# ==========================
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.web.error.include-stacktrace=on_param
spring.web.error.include-exception=true

# ==========================
# Debug Logging (Optional)
# ==========================
debug=true